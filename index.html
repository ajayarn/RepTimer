<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rep Timer</title>
    <script>
      window.REPTIMER_THEME_KEY = 'reptimer_theme';
      (function () {
        try {
          if (localStorage.getItem(window.REPTIMER_THEME_KEY) === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="theme-toggle" type="button" aria-label="Switch to light theme">☀️</button>
    <main aria-label="Rep Timer app">

      <!-- ── SETUP SCREEN ─────────────────────────── -->
      <div id="setup-screen">
        <h1>REP TIMER</h1>

        <div class="workout-type-selector" role="group" aria-label="Workout type">
          <button class="wt-btn" id="wt-6count" type="button"
            onclick="selectWorkoutType('6count')" aria-pressed="false">6-COUNT</button>
          <button class="wt-btn" id="wt-navyseals" type="button"
            onclick="selectWorkoutType('navyseals')" aria-pressed="false">NAVY SEALS</button>
        </div>

        <section id="input-box" aria-label="Workout settings">
          <div class="input-row">
            <div class="input-group">
              <label for="time">MINS</label>
              <input type="number" id="time" name="time" value="20"
                min="1" step="0.1" inputmode="decimal" required />
            </div>
            <div class="input-group">
              <label for="reps">REPS</label>
              <input type="number" id="reps" name="reps" value="40"
                min="1" step="1" inputmode="numeric" required />
            </div>
          </div>
          <div id="rep-pace-hint" aria-live="polite"></div>
        </section>

        <div id="validation-error" class="validation-error" role="alert" aria-live="assertive"></div>
        <button class="start-btn" id="start-btn" type="button">START</button>

        <section id="history-panel" aria-label="Workout history">
          <div class="history-header">
            <span class="history-title">HISTORY</span>
            <span class="history-legend">
              <span class="legend-dot legend-dot--6count">●</span> 6-Count
              <span class="legend-dot legend-dot--navyseals">●</span> Navy Seals
            </span>
          </div>
          <canvas id="history-chart" aria-label="Workout progress chart"></canvas>
          <div id="history-log" aria-label="Recent workouts"></div>
        </section>
      </div>

      <!-- ── ACTIVE SCREEN ────────────────────────── -->
      <div id="active-screen" hidden>

        <!-- Header: workout type + which rep -->
        <div id="active-header">
          <div id="workout-type-badge" class="workout-type-badge" hidden></div>
          <div id="rep-count" aria-live="polite">0 of 40</div>
        </div>

        <!-- Ring: per-rep countdown -->
        <div id="ring-wrap">
          <svg id="ring-svg" viewBox="0 0 220 220" aria-hidden="true">
            <circle class="ring-track" cx="110" cy="110" r="95" fill="none"></circle>
            <circle id="ring-progress" class="ring-progress" cx="110" cy="110" r="95" fill="none"></circle>
          </svg>
          <div id="ring-center" role="progressbar" aria-label="Time until next rep"
            aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div id="status" role="status" aria-live="polite" aria-atomic="true">READY</div>
            <div id="big-timer" aria-live="polite" aria-atomic="true">00:00</div>
            <div id="message" aria-live="polite"></div>
          </div>
        </div>

        <!-- Stats: reps done/left (tap to toggle) / remaining/elapsed (tap to toggle) -->
        <div id="stat-row">
          <button type="button" class="stat-card" id="reps-stat-btn" aria-label="Toggle reps done / reps left">
            <div id="reps-stat-label" class="stat-label">REPS DONE</div>
            <div id="stat-reps-done" class="stat-value accent">0/40</div>
          </button>
          <button type="button" class="stat-card" id="time-stat-btn" aria-label="Toggle remaining / elapsed time">
            <div id="top-panel-label" class="stat-label">REMAINING</div>
            <div id="workout-timer" class="stat-value" aria-live="polite" aria-atomic="true">20:00</div>
          </button>
        </div>

        <!-- Controls -->
        <div class="buttons" role="group" aria-label="Timer controls">
          <button class="pause-btn" id="pause-btn" type="button">PAUSE</button>
          <button class="reset-btn" id="reset-btn" type="button">RESET</button>
        </div>

      </div>

    </main>

    <div id="confetti-container" aria-hidden="true"></div>

    <noscript>This app requires JavaScript to run the timer.</noscript>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
    <script>
      (function () {
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const repsStatBtn = document.getElementById('reps-stat-btn');
        const timeStatBtn = document.getElementById('time-stat-btn');
        if (startBtn) startBtn.addEventListener('click', startTimer);
        if (pauseBtn) pauseBtn.addEventListener('click', pauseTimer);
        if (resetBtn) resetBtn.addEventListener('click', resetTimer);
        if (themeToggleBtn) themeToggleBtn.addEventListener('click', toggleTheme);
        if (repsStatBtn) repsStatBtn.addEventListener('click', toggleRepsStat);
        if (timeStatBtn) timeStatBtn.addEventListener('click', toggleTimeStat);
      })();
    </script>
  </body>
</html>
