<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rep Timer</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main aria-label="Rep Timer app">
            <h1 class="visually-hidden">Rep Timer</h1>

            <div
                id="message"
                role="status"
                aria-live="polite"
                aria-atomic="true"
            >
                REP TIMER
            </div>

            <div class="workout-type-selector" role="group" aria-label="Workout type">
                <button
                    class="wt-btn"
                    id="wt-6count"
                    type="button"
                    onclick="selectWorkoutType('6count')"
                    aria-pressed="false"
                >
                    6-Count
                </button>
                <button
                    class="wt-btn"
                    id="wt-navyseals"
                    type="button"
                    onclick="selectWorkoutType('navyseals')"
                    aria-pressed="false"
                >
                    Navy Seals
                </button>
            </div>

            <section
                class="input-box"
                id="input-box"
                aria-label="Workout settings"
            >
                <div class="input-group">
                    <label for="time">Minutes:</label>
                    <input
                        type="number"
                        id="time"
                        name="time"
                        placeholder="mins"
                        value="20"
                        min="1"
                        step="0.1"
                        inputmode="decimal"
                        required
                    />
                </div>

                <div class="input-group">
                    <label for="reps">Reps:</label>
                    <input
                        type="number"
                        id="reps"
                        name="reps"
                        placeholder="reps"
                        value="40"
                        min="1"
                        step="1"
                        inputmode="numeric"
                        required
                    />
                </div>
            </section>

            <div class="buttons" role="group" aria-label="Timer controls">
                <button class="start-btn" id="start-btn" type="button">
                    Start
                </button>
                <button class="pause-btn" id="pause-btn" type="button" hidden>
                    Pause
                </button>
                <button class="reset-btn" id="reset-btn" type="button" hidden>
                    Reset
                </button>
            </div>

            <div id="big-timer" hidden aria-live="polite" aria-atomic="true">
                00:00
            </div>

            <section
                class="input-box"
                id="status-msg"
                aria-label="Progress status"
            >
                <div
                    id="status"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                >
                    Ready
                </div>
                <div class="rep-info">
                    <div id="rep-count" aria-live="polite"></div>
                    <div id="rep-timer" aria-live="polite"></div>
                </div>
            </section>

            <div class="progress-container" aria-label="Workout progress">
                <div
                    id="progressBar"
                    class="progress-bar"
                    role="progressbar"
                    aria-label="Rep completion"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                ></div>
            </div>
        </main>

        <audio
            id="clapSound"
            src="timersounds/clapping.mp3"
            preload="auto"
        ></audio>
        <div id="confetti-container" aria-hidden="true"></div>

        <noscript>This app requires JavaScript to run the timer.</noscript>

        <script src="app.js"></script>
        <script>
            (function () {
                const startBtn = document.getElementById("start-btn");
                const pauseBtn = document.getElementById("pause-btn");
                const resetBtn = document.getElementById("reset-btn");

                if (startBtn) startBtn.addEventListener("click", startTimer);
                if (pauseBtn) pauseBtn.addEventListener("click", pauseTimer);
                if (resetBtn) resetBtn.addEventListener("click", resetTimer);
            })();
        </script>
    </body>
</html>
